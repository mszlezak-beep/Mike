[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mike-workday"
version = "0.1.0"
description = "Invoke-driven orchestration for workday planning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "invoke",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
